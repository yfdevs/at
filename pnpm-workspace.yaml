packages:
  - packages/*

allowBuilds:
  better-sqlite3: true
  electron: true
  esbuild: true
  ffmpeg-static: true

catalog:
  axios: ^1.17.0
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  vite-plus: 0.2.6
minimumReleaseAgeExclude:
  - thinking-orbs@0.1.1
overrides:
  vite: 'catalog:'
  vitest: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
