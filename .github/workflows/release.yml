name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version v$version"
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm build

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $releaseDir = Join-Path "release" $version
          $assets = Get-ChildItem -LiteralPath $releaseDir -File | Where-Object {
            $_.Name -eq "latest.yml" -or
            $_.Name -like "*-Setup.exe" -or
            $_.Name -like "*-Setup.exe.blockmap"
          } | ForEach-Object FullName

          $latest = $assets | Where-Object { (Split-Path $_ -Leaf) -eq "latest.yml" }
          $installer = $assets | Where-Object { $_ -like "*-Setup.exe" }
          if (-not $latest -or -not $installer) {
            throw "Windows installer or latest.yml was not generated in $releaseDir"
          }

          gh release create $env:GITHUB_REF_NAME $assets `
            --generate-notes `
            --verify-tag `
            --title $env:GITHUB_REF_NAME
